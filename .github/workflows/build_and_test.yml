name: Build & Test

on:
  workflow_dispatch: # lets you run a build from the UI
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit supplied by release preparation
        required: false
        default: ''
        type: string
      build_matrix:
        description: Release build variants as a JSON include matrix; empty keeps everyday CI
        required: false
        default: ''
        type: string
      package_version:
        description: Validated full tag version for release filenames; empty uses VERSION
        required: false
        default: ''
        type: string
  push:
    branches: ['**'] # Version tags are handled by release.yml.
  pull_request:

permissions:
  contents: read

# Keep callers separate and avoid sharing a concurrency group with release.yml.
concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  DISPLAY: :0 # linux pluginval needs this
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  # IPP_DIR: C:\Program Files (x86)\Intel\oneAPI\ipp\latest\lib\cmake\ipp

defaults:
  run:
    shell: bash

# jobs are run in parallel on different machines
# all steps run in series
jobs:
  build_and_test:
    # don't double run on PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix: >-
        ${{ fromJSON(inputs.build_matrix || '{
          "include": [
            {
              "name": "Linux",
              "os": "ubuntu-22.04",
              "arch": "x64",
              "simd": "DEFAULT",
              "extra-flags": "-G Ninja -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld",
              "pluginval-binary": "./pluginval"
            },
            {
              "name": "macOS",
              "os": "macos-14",
              "arch": "arm64",
              "simd": "DEFAULT",
              "extra-flags": "-G Ninja -DCMAKE_OSX_ARCHITECTURES=\"arm64;x86_64\"",
              "pluginval-binary": "pluginval.app/Contents/MacOS/pluginval"
            },
            {
              "name": "Windows",
              "os": "windows-latest",
              "arch": "x64",
              "simd": "DEFAULT",
              "extra-flags": "-G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl",
              "pluginval-binary": "./pluginval.exe"
            }
          ]
        }') }}

    steps:
      # Setup MSVC toolchain and developer command prompt (Windows)
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}

      # Use clang on Linux (all three platforms now use Clang)
      - name: Set up Clang
        if: runner.os == 'Linux' && matrix.arch != 'arm64'
        uses: egor-tensin/setup-clang@v2

      - name: Set up native Clang (Linux ARM64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"

      - name: Install JUCE's Linux Deps
        if: runner.os == 'Linux'
        # Thanks to McMartin & co https://forum.juce.com/t/list-of-juce-dependencies-under-linux/15121/44
        run: |
          # IPP setup (disabled)
          # wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          # echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          # sudo apt install intel-oneapi-ipp-devel
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxrender-dev libxcomposite-dev libfontconfig1-dev libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev ladspa-sdk xvfb openbox x11-utils ninja-build lld

      - name: Start Linux test desktop
        if: runner.os == 'Linux'
        run: |
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for attempt in {1..60}; do
            if xdpyinfo -display "$DISPLAY" > /dev/null 2>&1; then break; fi
            sleep 0.25
          done
          if ! xdpyinfo -display "$DISPLAY" > /dev/null 2>&1; then
            cat "$RUNNER_TEMP/xvfb.log"
            exit 1
          fi
          # Native editor tests need window-manager atoms and focus handling, not just an X server.
          openbox --sm-disable > "$RUNNER_TEMP/openbox.log" 2>&1 &
          for attempt in {1..60}; do
            if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id #'; then break; fi
            sleep 0.25
          done
          if ! xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id #'; then
            cat "$RUNNER_TEMP/openbox.log"
            exit 1
          fi
          xprop -root _NET_SUPPORTING_WM_CHECK

      # IPP installation is deferred until profiling justifies it.
      # - name: Install IPP (Windows)
      #   if: (runner.os == 'Windows')
      #   run: |
      #     nuget install intelipp.static.win-x64 -Version 2026.0.0.712

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v ninja; then choco install ninja -y --no-progress; fi

      - name: Ensure Inno Setup is available (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc; then
            choco install innosetup -y --no-progress
            cygpath -w '/c/Program Files (x86)/Inno Setup 6' >> "$GITHUB_PATH"
          fi

      - name: Install macOS Deps
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja osxutils

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Cache the build
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DOPENQ_SIMD_TARGET=${{ matrix.simd }} ${{ matrix.extra-flags }} .

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Test & Benchmarks
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --verbose --output-on-failure

      - name: Read in .env from CMake # see GitHubENV.cmake
        run: |
          cat .env # show us the config
          cat .env >> $GITHUB_ENV # pull in our PRODUCT_NAME, etc

      - name: Set additional env vars for next steps
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          ARTIFACTS_PATH=${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "VST3_PATH=$ARTIFACTS_PATH/VST3/${{ env.PRODUCT_NAME }}.vst3" >> $GITHUB_ENV
          echo "AU_PATH=$ARTIFACTS_PATH/AU/${{ env.PRODUCT_NAME }}.component" >> $GITHUB_ENV
          echo "CLAP_PATH=$ARTIFACTS_PATH/CLAP/${{ env.PRODUCT_NAME }}.clap" >> $GITHUB_ENV
          echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${{ env.PRODUCT_NAME }}.app" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ env.PRODUCT_NAME }}-${PACKAGE_VERSION:-${VERSION}}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Include licenses and credits
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "${{ env.ARTIFACTS_PATH }}/"
          cp -R licenses "${{ env.ARTIFACTS_PATH }}/"

      # The published Linux/Windows validators are x86-64 and cannot load ARM64 plugins.
      - name: Checkout native validator source
        if: matrix.native-pluginval == true
        uses: actions/checkout@v7
        with:
          repository: Tracktion/pluginval
          ref: ed19c2c16b57a6d94db391bea3ef4a80b769d5bf # v1.0.4
          path: .ci-tools/pluginval
          submodules: recursive
          persist-credentials: false

      - name: Build native validator
        if: matrix.native-pluginval == true
        run: |
          flags=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The pinned validator's older JUCE uses x86 debug asm under ARM64 clang-cl.
            # msvc-dev-cmd already selects the native ARM64 cl toolchain.
            flags+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
          fi
          cmake -S .ci-tools/pluginval -B .ci-tools/pluginval-build "${flags[@]}"
          cmake --build .ci-tools/pluginval-build --config Release --target pluginval --parallel 2

      - name: Download validator
        if: matrix.native-pluginval != true
        run: |
          curl --fail --location --remote-name "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_${{ runner.os }}.zip"
          7z x pluginval_${{ runner.os }}.zip

      - name: Pluginval
        run: ${{ matrix.pluginval-binary }} --strictness-level 10 --verbose --validate "${{ env.VST3_PATH }}"

      # Signing/notarization deferred. Re-enable after credentials are configured.
      # - name: Import Certificates (macOS)
      #   uses: sudara/basic-macos-keychain-action@v1
      #   id: keychain
      #   if: ${{ runner.os == 'macOS'}}
      #   with:
      #     dev-id-app-cert: ${{ secrets.DEV_ID_APP_CERT }}
      #     dev-id-app-password: ${{ secrets.DEV_ID_APP_PASSWORD }}
      #     dev-id-installer-cert: ${{ secrets.DEV_ID_INSTALLER_CERT }}
      #     dev-id-installer-password: ${{ secrets.DEV_ID_INSTALLER_PASSWORD }}

      # - name: Codesign (macOS)
      #   if: ${{ runner.os == 'macOS' }}
      #   timeout-minutes: 5
      #   run: |
      #     # Each plugin must be code signed
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.VST3_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.AU_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.CLAP_PATH }}" --deep --strict --options=runtime --timestamp
      #     codesign --force --keychain ${{ steps.keychain.outputs.keychain-path }} -s "${{ secrets.DEVELOPER_ID_APPLICATION}}" -v "${{ env.STANDALONE_PATH }}" --deep --strict --options=runtime --timestamp

      - name: Add Custom Icons (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          # add the icns as its own icon resource (meta!)
          sips -i packaging/pamplejuce.icns

          # Grab the resource, put in tempfile
          DeRez -only icns packaging/pamplejuce.icns > /tmp/icons

          # Stuff the resource into the strange Icon? file's resource fork
          Rez -a /tmp/icons -o "${{ env.VST3_PATH }}/Icon"$'\r'
          Rez -a /tmp/icons -o "${{ env.AU_PATH }}/Icon"$'\r'
          Rez -a /tmp/icons -o "${{ env.CLAP_PATH }}/Icon"$'\r'

          # Set custom icon attribute
          SetFile -a C "${{ env.VST3_PATH }}"
          SetFile -a C "${{ env.AU_PATH }}"
          SetFile -a C "${{ env.CLAP_PATH }}"

      # Signing/notarization deferred. Re-enable after credentials are configured.
      # - name: pkgbuild, Productbuild and Notarize
      #   if: ${{ runner.os == 'macOS' }}
      #   timeout-minutes: 5
      #   run: |
      #     pkgbuild --identifier "${{ env.BUNDLE_ID }}.au.pkg" --version $VERSION --component "${{ env.AU_PATH }}" --install-location "/Library/Audio/Plug-Ins/Components"  "packaging/${{ env.PRODUCT_NAME }}.au.pkg"
      #     pkgbuild --identifier "${{ env.BUNDLE_ID }}.vst3.pkg" --version $VERSION --component "${{ env.VST3_PATH }}" --install-location "/Library/Audio/Plug-Ins/VST3" "packaging/${{ env.PRODUCT_NAME }}.vst3.pkg"
      #     pkgbuild --identifier "${{ env.BUNDLE_ID }}.clap.pkg" --version $VERSION --component "${{ env.CLAP_PATH }}" --install-location "/Library/Audio/Plug-Ins/CLAP" "packaging/${{ env.PRODUCT_NAME }}.clap.pkg"

      #     # Standalone is special, needs a boolean to always install in /Applications
      #     pkgbuild --analyze --root "$(dirname "${{ env.STANDALONE_PATH }}")" standalone.plist
      #     plutil -replace BundleIsRelocatable -bool NO standalone.plist
      #     pkgbuild --identifier "${{ env.BUNDLE_ID }}.app.pkg" --version $VERSION --root "$(dirname "${{ env.STANDALONE_PATH }}")" --component-plist standalone.plist --install-location "/Applications" "packaging/${{ env.PRODUCT_NAME }}.app.pkg"

      #     cp LICENSE packaging/resources/LICENSE
      #     cd packaging
      #     envsubst < distribution.xml.template > distribution.xml
      #     productbuild --resources ./resources --distribution distribution.xml --sign "${{ secrets.DEVELOPER_ID_INSTALLER }}" --timestamp "${{ env.ARTIFACT_NAME }}.pkg"

      #     xcrun notarytool submit "${{ env.ARTIFACT_NAME }}.pkg" --apple-id ${{ secrets.NOTARIZATION_USERNAME }} --password ${{ secrets.NOTARIZATION_PASSWORD }} --team-id ${{ secrets.TEAM_ID }} --wait
      #     xcrun stapler staple "${{ env.ARTIFACT_NAME }}.pkg"

      - name: Zip
        if: ${{ runner.os != 'Windows' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: |
          bundles=(VST3 CLAP Standalone)
          # JUCE enables AUv3 only with Xcode; these jobs use Ninja.
          if [[ "$RUNNER_OS" == macOS ]]; then bundles+=(AU); fi
          for bundle in "${bundles[@]}"; do
            if [[ ! -d "$bundle" ]]; then
              echo "::error::Missing required archive directory: $bundle (in $PWD)"
              ls -la
              exit 1
            fi
          done
          7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" "${bundles[@]}" LICENSE THIRD_PARTY_NOTICES.md README.md licenses

      - name: Generate Installer
        if: ${{ runner.os == 'Windows' }}
        run: |
          architecture=x64compatible
          if [[ '${{ matrix.arch }}' == arm64 ]]; then architecture=arm64; fi
          MSYS_NO_PATHCONV=1 iscc "/DInstallerArchitecture=$architecture" "/DArtifactName=${{ env.ARTIFACT_NAME }}" "packaging\installer.iss"
          mv "packaging/Output/${{ env.ARTIFACT_NAME }}.exe" "${{ env.ARTIFACTS_PATH }}/"

      # Signing/notarization deferred. Re-enable after credentials are configured.
      # - name: Codesign with Azure Trusted Signing
      #   if: ${{ runner.os == 'Windows' }}
      #   uses: azure/artifact-signing-action@v2
      #   with:
      #     # The Azure Active Directory tenant (directory) ID.
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      #     # The client (application) ID of an App Registration in the tenant.
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}

      #     # A client secret that was generated for the App Registration.
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      #     # The Code Signing Account endpoint. The URI value must have a URI that aligns to the region your Code Signing Account and Certificate Profile you are specifying were created in during the setup of these resources.
      #     endpoint: ${{ secrets.AZURE_ENDPOINT }}

      #     # The Code Signing Account name.
      #     signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}

      #     # The Certificate Profile name.
      #     certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}

      #     # This signs all exes inside the folder
      #     files-folder: ${{ env.ARTIFACTS_PATH }}
      #     files-folder-filter: exe

      - name: Upload Exe (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}.exe
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.exe"
          if-no-files-found: error

      - name: Upload Zip (Linux and macOS)
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.zip"
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            Builds/**/CMakeConfigureLog.yaml
            Builds/Testing/Temporary/**
            .ci-tools/pluginval-build/**/CMakeConfigureLog.yaml
