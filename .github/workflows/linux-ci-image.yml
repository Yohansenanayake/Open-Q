name: Linux CI Image

on:
  workflow_dispatch:
  push:
    paths: ['.github/docker/linux-ci.Dockerfile']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set image name
        run: echo "CI_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-q-linux-ci:latest" >> "$GITHUB_ENV"

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: docker build -t "$CI_IMAGE" -f .github/docker/linux-ci.Dockerfile .

      - name: Push
        run: docker push "$CI_IMAGE"
